name: phoneme_party
description: "Phoneme Party: speaking clearly should be fun. Offline pronunciation game for kids."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_onnxruntime: 1.9.0
  record: 7.1.2
  flutter_tts: 4.2.5
  audioplayers: 6.8.1
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/phrases/
    - assets/emoji/
    - assets/panphon/
    - assets/models/
